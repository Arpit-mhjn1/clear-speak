<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClearSpeak - Text to Speech</title>
  <style>
    /* Modern Dark Theme */
    :root {
      --bg-color: #121212;
      --container-bg: #1e1e1e;
      --accent-color: #00e5ff;
      --accent-hover: #00b3cc;
      --text-color: #ffffff;
      --text-secondary: #aaaaaa;
    }

    body {
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    * {
      box-sizing: border-box;
    }

    /* Top Navigation */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: clamp(12px, 1.8vh, 16px) clamp(16px, 3vw, 40px);
      background-color: var(--container-bg);
      border-bottom: 1px solid #333;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: clamp(8px, 1.5vw, 14px);
      font-size: clamp(1.2rem, 2.5vw, 1.5rem);
      font-weight: bold;
      color: var(--accent-color);
      text-decoration: none;
    }

    .nav-brand img {
      height: clamp(30px, 4vh, 38px);
      border-radius: 8px;
    }

    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: clamp(0.9rem, 1.5vw, 1rem);
      transition: color 0.2s ease;
    }
    .nav-links a:hover {
      color: var(--accent-color);
    }

    /* Layout & Sidebar */
    .app-container {
      display: flex;
      flex-direction: row;
      flex: 1;
      width: 100%;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }
    
    .sidebar {
      width: clamp(220px, 18vw, 260px);
      background-color: var(--container-bg);
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
      padding: clamp(15px, 2vh, 25px) 0;
      transition: margin-left 0.3s ease, transform 0.3s ease;
      z-index: 90;
      flex-shrink: 0;
    }
    .sidebar.hidden {
      margin-left: calc(-1 * clamp(220px, 18vw, 260px));
    }
    
    .sidebar-menu {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 0 clamp(10px, 1.5vw, 15px);
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: clamp(10px, 1.5vw, 15px);
      padding: clamp(10px, 1.5vh, 13px) clamp(14px, 2vw, 20px);
      border-radius: 8px;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s ease;
      font-size: clamp(0.95rem, 1.5vw, 1.05rem);
    }
    .menu-item:hover {
      background-color: rgba(0, 229, 255, 0.1);
      color: var(--accent-color);
    }
    .menu-item.active {
      background-color: var(--accent-color);
      color: var(--bg-color);
    }
    .menu-icon { font-size: clamp(1.1rem, 1.8vw, 1.25rem); }
    
    .sidebar-backdrop {
      display: none;
    }
    
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      padding: clamp(16px, 3vw, 40px);
      width: 100%;
      min-height: 0;
      box-sizing: border-box;
    }
    
    .toggle-btn {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: clamp(1.3rem, 2.5vw, 1.6rem);
      cursor: pointer;
      margin-right: clamp(10px, 1.5vw, 15px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .toggle-btn:hover { color: var(--accent-color); }

    /* Responsive Relative TTS Container */
    .tts-container {
      width: min(100%, 780px);
      margin: auto;
      background-color: var(--container-bg);
      border-radius: clamp(14px, 2vw, 20px);
      padding: clamp(20px, 4vw, 40px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      border: 1px solid #2a2a2a;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    h1 {
      color: var(--text-color);
      margin-top: 0;
      margin-bottom: clamp(6px, 1vh, 10px);
      font-size: clamp(1.6rem, 3.5vw, 2.3rem);
    }

    p.subtitle {
      color: var(--text-secondary);
      margin-bottom: clamp(18px, 3vh, 30px);
      font-size: clamp(0.95rem, 1.8vw, 1.1rem);
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      height: clamp(140px, 24vh, 220px);
      background-color: #2a2a2a;
      border: 2px solid #333;
      border-radius: 12px;
      color: white;
      font-size: clamp(1rem, 1.8vw, 1.2rem);
      padding: clamp(14px, 2vw, 20px);
      resize: vertical;
      box-sizing: border-box;
      font-family: inherit;
      transition: border-color 0.3s, box-shadow 0.3s;
      margin-bottom: clamp(16px, 2.5vh, 25px);
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(0, 229, 255, 0.2);
    }

    .controls {
      display: flex;
      gap: clamp(10px, 2vw, 15px);
      flex-wrap: wrap;
    }

    button {
      background-color: var(--accent-color);
      color: var(--bg-color);
      border: none;
      padding: clamp(11px, 1.6vw, 14px) clamp(22px, 3vw, 32px);
      font-size: clamp(0.95rem, 1.8vw, 1.1rem);
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    button:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 229, 255, 0.4);
    }

    button:active {
      transform: scale(0.98);
    }

    button.clear-btn {
      background-color: transparent;
      color: var(--text-secondary);
      border: 2px solid #444;
      box-shadow: none;
    }

    button.clear-btn:hover {
      background-color: #333;
      color: white;
      transform: none;
      box-shadow: none;
    }

    /* Mobile drawer overlay */
    @media (max-width: 820px) {
      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        height: 100vh;
        box-shadow: 6px 0 25px rgba(0, 0, 0, 0.7);
        transform: translateX(0);
        margin-left: 0 !important;
        z-index: 1000;
      }
      .sidebar.hidden {
        transform: translateX(-100%);
      }
      .sidebar-backdrop {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(4px);
        z-index: 999;
      }
      .sidebar-backdrop.active {
        display: block;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <nav>
    <div style="display: flex; align-items: center;">
      <button id="sidebarToggle" class="toggle-btn" aria-label="Toggle Navigation">☰</button>
      <a href="index.html" class="nav-brand">
        <img src="logo.png" alt="ClearSpeak">
        ClearSpeak
      </a>
    </div>
    <div class="nav-links">
      <a href="index.html">&larr; Back to Home</a>
    </div>
  </nav>

  <div class="app-container">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <!-- Side Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-menu">
        <a href="index.html" class="menu-item">
          <span class="menu-icon">🏠</span> Home
        </a>
        <a href="app.html" class="menu-item">
          <span class="menu-icon">📹</span> Live Translator
        </a>
        <a href="tts.html" class="menu-item active">
          <span class="menu-icon">🔊</span> Text-to-Speech
        </a>
        <a href="text-to-sign.html" class="menu-item">
          <span class="menu-icon">✨</span> Text-to-Sign
        </a>
        <a href="https://drive.google.com/drive/folders/1U-Pr4r1-cupgNOOq9NH_uTsQnPSVEKco" target="_blank" class="menu-item">
          <span class="menu-icon">📚</span> Dictionary Data
        </a>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">

  <div class="tts-container">
    <h1>Text to Speech</h1>
    <p class="subtitle">Type or paste any text below, and ClearSpeak will read it out loud.</p>
    
    <textarea id="textInput" placeholder="Hello, how are you doing today?"></textarea>
    
    <div class="controls">
      <button id="speakBtn">
        🔊 Speak Loudly
      </button>
      <button id="clearBtn" class="clear-btn">
        Clear Text
      </button>
    </div>
  </div>

  </main>
  </div>

  <script>
    // Responsive Sidebar Toggle
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebarBackdrop = document.getElementById('sidebarBackdrop');

    if (window.innerWidth <= 820) {
      sidebar.classList.add('hidden');
    }

    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('hidden');
      if (sidebarBackdrop && window.innerWidth <= 820) {
        sidebarBackdrop.classList.toggle('active', !sidebar.classList.contains('hidden'));
      }
    });

    if (sidebarBackdrop) {
      sidebarBackdrop.addEventListener('click', () => {
        sidebar.classList.add('hidden');
        sidebarBackdrop.classList.remove('active');
      });
    }
    const textInput = document.getElementById('textInput');
    const speakBtn = document.getElementById('speakBtn');
    const clearBtn = document.getElementById('clearBtn');
    const synth = window.speechSynthesis;

    function speakText() {
      const textToSpeak = textInput.value.trim();
      if (textToSpeak !== "") {
        synth.cancel(); // Cancel any ongoing speech
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        
        // Make it slightly louder and clearer
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        utterance.volume = 1.0; // Max volume
        
        synth.speak(utterance);
      }
    }

    speakBtn.addEventListener('click', speakText);

    clearBtn.addEventListener('click', () => {
      textInput.value = "";
      synth.cancel();
      textInput.focus();
    });

    // Also allow Ctrl+Enter to speak
    textInput.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        speakText();
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClearSpeak - Text to Speech</title>
  <style>
    /* Modern Dark Theme */
    :root {
      --bg-color: #121212;
      --container-bg: #1e1e1e;
      --accent-color: #00e5ff;
      --accent-hover: #00b3cc;
      --text-color: #ffffff;
      --text-secondary: #aaaaaa;
    }

    body {
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;

      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    /* Navigation */
    nav {
      display: flex;
      justify-content: space-between;

      width: 100%;
      max-width: 800px;
      padding: 20px 0;
      margin-bottom: 40px;
    }

    .nav-brand {
      display: flex;

      gap: 15px;
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent-color);
      text-decoration: none;
    }

    .nav-brand img {
      height: 40px;
      border-radius: 8px;
    }


    /* Sidebar Navigation */
    .app-container {
      display: flex;
      flex-direction: row;
      flex-grow: 1;
      width: 100%;
      overflow: hidden;
    }
    
    .sidebar {
      width: 250px;
      background-color: var(--container-bg);
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
      padding: 20px 0;
      transition: margin-left 0.3s ease;
      z-index: 90;
    }
    .sidebar.hidden {
      margin-left: -250px;
    }
    
    .sidebar-menu {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 0 15px;
    }
    .menu-item {
      display: flex;

      gap: 15px;
      padding: 12px 20px;
      border-radius: 8px;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s ease;
      font-size: 1.05rem;
    }
    .menu-item:hover {
      background-color: rgba(0, 229, 255, 0.1);
      color: var(--accent-color);
    }
    .menu-item.active {
      background-color: var(--accent-color);
      color: var(--bg-color);
    }
    .menu-icon { font-size: 1.2rem; }
    
    .main-content {
      flex-grow: 1;
      display: flex;
      flex-direction: column;

      overflow-y: auto;
      padding-top: 40px;
      height: calc(100vh - 80px);
      width: 100%;
    }
    
    .toggle-btn {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 1.5rem;
      cursor: pointer;
      margin-right: 15px;
      display: flex;

      justify-content: center;
    }
    .toggle-btn:hover { color: var(--accent-color); }

    /* TTS Container */
    .tts-container {
      width: 100%;
      max-width: 800px;
      background-color: var(--container-bg);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      box-sizing: border-box;
    }

    h1 {
      color: var(--text-color);
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 2.2rem;
    }

    p.subtitle {
      color: var(--text-secondary);
      margin-bottom: 30px;
      font-size: 1.1rem;
    }

    textarea {
      width: 100%;
      height: 200px;
      background-color: #2a2a2a;
      border: 2px solid #333;
      border-radius: 12px;
      color: white;
      font-size: 1.2rem;
      padding: 20px;
      resize: vertical;
      box-sizing: border-box;
      font-family: inherit;
      transition: border-color 0.3s;
      margin-bottom: 25px;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .controls {
      display: flex;
      gap: 15px;

      flex-wrap: wrap;
    }

    button {
      background-color: var(--accent-color);
      color: var(--bg-color);
      border: none;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
      display: flex;

      gap: 10px;
    }

    button:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 229, 255, 0.4);
    }

    button:active {
      transform: scale(0.98);
    }

    button.clear-btn {
      background-color: transparent;
      color: var(--text-secondary);
      border: 2px solid #444;
      box-shadow: none;
    }

    button.clear-btn:hover {
      background-color: #333;
      color: white;
      transform: none;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <nav style="padding: 15px 40px; border-bottom: 1px solid #333; background-color: var(--container-bg); max-width: 100%; margin-bottom: 0;">
    <div style="display: flex; align-items: center;">
      <button id="sidebarToggle" class="toggle-btn">☰</button>
      <a href="index.html" class="nav-brand">
        <img src="logo.png" alt="ClearSpeak">
        ClearSpeak
      </a>
    </div>
    <div class="nav-links">
      <a href="index.html" style="color: var(--text-secondary); text-decoration: none;">&larr; Back to Home</a>
    </div>
  </nav>

  <div class="app-container">
    <!-- Side Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-menu">
        <a href="index.html" class="menu-item">
          <span class="menu-icon">🏠</span> Home
        </a>
        <a href="app.html" class="menu-item">
          <span class="menu-icon">📹</span> Live Translator
        </a>
        <a href="tts.html" class="menu-item active">
          <span class="menu-icon">🔊</span> Text-to-Speech
        </a>
        <a href="https://drive.google.com/drive/folders/1U-Pr4r1-cupgNOOq9NH_uTsQnPSVEKco" target="_blank" class="menu-item">
          <span class="menu-icon">📚</span> Dictionary Data
        </a>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">

  <div class="tts-container">
    <h1>Text to Speech</h1>
    <p class="subtitle">Type or paste any text below, and ClearSpeak will read it out loud.</p>
    
    <textarea id="textInput" placeholder="Hello, how are you doing today?"></textarea>
    
    <div class="controls">
      <button id="speakBtn">
        🔊 Speak Loudly
      </button>
      <button id="clearBtn" class="clear-btn">
        Clear Text
      </button>
    </div>
  </div>

  </main>
  </div>

  <script>
    // Sidebar Toggle
    document.getElementById('sidebarToggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('hidden');
    });
    const textInput = document.getElementById('textInput');
    const speakBtn = document.getElementById('speakBtn');
    const clearBtn = document.getElementById('clearBtn');
    const synth = window.speechSynthesis;

    function speakText() {
      const textToSpeak = textInput.value.trim();
      if (textToSpeak !== "") {
        synth.cancel(); // Cancel any ongoing speech
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        
        // Make it slightly louder and clearer
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        utterance.volume = 1.0; // Max volume
        
        synth.speak(utterance);
      }
    }

    speakBtn.addEventListener('click', speakText);

    clearBtn.addEventListener('click', () => {
      textInput.value = "";
      synth.cancel();
      textInput.focus();
    });

    // Also allow Ctrl+Enter to speak
    textInput.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        speakText();
      }
    });
  </script>
</body>
</html>
